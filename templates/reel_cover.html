<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:{{ d.font_stack | safe }};background:{{ d.bg_alt }};color:#f5f4f1;-webkit-font-smoothing:antialiased}
  .cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:{{ d.bg_alt }}}
  .cover:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 0 36%,rgba(224,133,95,.12) 36.2% 36.7%,transparent 37% 100%)}
  .meta{position:absolute;left:92px;right:92px;top:118px;display:flex;justify-content:space-between;align-items:center;color:rgba(245,244,241,.64);font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.12em;text-transform:uppercase}
  .meta .rule{width:190px;height:3px;background:{{ d.accent_on_dark | default(d.accent) }}}
  .focus{position:absolute;left:92px;right:92px;top:570px;bottom:475px;display:flex;flex-direction:column;justify-content:center}
  .headline{font-size:104px;line-height:.98;letter-spacing:-.055em;font-weight:800;max-width:8.4ch;text-wrap:balance}
  .signal{margin-top:66px;width:max-content;max-width:100%;padding:20px 24px 18px;border:2px solid {{ d.accent_on_dark | default(d.accent) }};color:{{ d.accent_on_dark | default(d.accent) }};font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;letter-spacing:.07em;line-height:1.15;text-transform:uppercase}
  .layout-split .focus:before,.layout-split .focus:after{content:"";position:absolute;top:-170px;width:155px;height:16px;background:{{ d.accent }};opacity:.9}.layout-split .focus:before{left:0}.layout-split .focus:after{right:0;background:#f5f4f1}
  .layout-stamp .signal{border-radius:999px;transform:rotate(-5deg);background:{{ d.accent }};border-color:{{ d.accent }};color:#fff}
  .layout-stamp .headline{position:relative}.layout-stamp .headline:after{content:"FIELD NOTE";position:absolute;right:-135px;top:-74px;padding:11px 14px;border:2px solid rgba(245,244,241,.55);font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.08em;transform:rotate(8deg);color:rgba(245,244,241,.75)}
  .layout-signal .signal{border-left-width:14px}
  .footer{position:absolute;left:92px;right:92px;bottom:126px;display:flex;align-items:end;justify-content:space-between;color:rgba(245,244,241,.62)}
  .footer img{width:230px;height:auto;opacity:.9}.footer .handle{font-size:24px;font-weight:600}.footer .kind{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
  <main class="cover layout-{{ layout }}">
    <div class="meta"><span>{{ pillar }}</span><span class="rule"></span></div>
    <section class="focus"><h1 class="headline">{{ headline }}</h1><div class="signal">{{ signal }}</div></section>
    <footer class="footer">
      {% if logo %}<img src="{{ logo }}" alt="">{% else %}<span class="handle">{{ d.handle_mark }}</span>{% endif %}
      <span class="kind">Open Reel</span>
    </footer>
  </main>
</body>
</html>
