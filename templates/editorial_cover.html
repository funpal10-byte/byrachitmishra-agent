<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden}
body{background:{{ d.bg }};color:{{ d.ink }};font-family:{{ d.font_stack | safe }}}
.cover{position:relative;width:1080px;height:1920px;padding:400px 90px 0}
.eyebrow{font:600 24px monospace;letter-spacing:.12em;text-transform:uppercase;color:{{ d.accent }}}
h1{font-size:{{ 100 if headline|length > 25 else 116 }}px;line-height:.96;letter-spacing:-.055em;font-weight:800;margin:32px 0 42px;max-width:880px;text-wrap:balance}
.signal{font-size:31px;margin-top:30px;font-weight:600}
.brand{position:absolute;top:1460px;left:90px;right:90px;border-top:2px solid {{ d.rule }};padding-top:28px;display:flex;align-items:center;justify-content:space-between;font:20px monospace}
.brand img{width:185px}
{% include 'visual.css' %}
.visual{margin-top:0}.visual-item{min-height:250px}
.visual-checklist .visual-item{min-height:0}
</style></head><body><main class="cover">
<div class="eyebrow">{{ pillar }}</div><h1>{{ headline }}</h1>
{% if visual %}{% include 'visual.html' %}{% endif %}
<div class="signal">{{ signal }}</div>
<div class="brand">{% if logo %}<img src="{{ logo }}" alt="Rachit Mishra">{% endif %}<span>{{ d.handle_mark }}</span></div>
</main></body></html>
