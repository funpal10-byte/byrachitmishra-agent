name: Publish what's due

# Hourly. Each run checks content/approved for posts whose scheduled time has
# passed and publishes them. Harmless when nothing is due.
#
# Until you set the PUBLISH_ENABLED repository variable to "true", this is a
# dry run — it prints what it would have posted and touches nothing. Leave it
# that way for a couple of weeks.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish due posts
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v25.0' }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          # Backlog guards. Raise MAX_PUBLISH_PER_RUN if you ever want a
          # queue to drain faster; raise STALE_AFTER_HOURS to let older
          # posts still go out rather than being retired unpublished.
          MAX_PUBLISH_PER_RUN: ${{ vars.MAX_PUBLISH_PER_RUN }}
          STALE_AFTER_HOURS: ${{ vars.STALE_AFTER_HOURS }}
        run: python -m agent.run_publish

      - name: Archive published posts
        run: |
          git config user.name  "byrachitmishra-agent"
          git config user.email "actions@github.com"
          git add -A content
          git diff --staged --quiet && exit 0
          git commit -m "Published due posts"
          git pull --rebase --autostash
          git push
