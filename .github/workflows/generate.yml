name: Draft the week

# Start Saturday at 06:00 IST, retry unfinished work at 12:00/18:00 and Sunday.
# A complete review PR or approved week is skipped without spending model quota.
on:
  schedule:
    - cron: "30 0,6,12 * * 0,6"
  workflow_dispatch:
    inputs:
      week_start:
        description: "Recovery only: Monday to generate (YYYY-MM-DD). Leave blank for next week."
        required: false
        type: string
      draft_review:
        description: "Keep the PR in draft while the generated posts receive an editorial review."
        required: false
        type: boolean
        default: false
      recovery_run_id:
        description: "Resume saved queue artifacts from a failed generation run."
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

# Do not cancel work already generating. Queued runs inspect the saved result.
concurrency:
  group: weekly-content-draft
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.target.outputs.week }}
      needed: ${{ steps.target.outputs.needed }}
    steps:
      - uses: actions/github-script@v7
        id: target
        env:
          REQUESTED_WEEK: ${{ inputs.week_start }}
        with:
          script: |
            const now = new Date(Date.now() + 330 * 60000);
            let week = process.env.REQUESTED_WEEK;
            if (!week) {
              now.setUTCDate(now.getUTCDate() + ((8 - now.getUTCDay()) % 7 || 7));
              week = now.toISOString().slice(0,10);
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(week) || new Date(week+'T00:00:00Z').getUTCDay() !== 1)
              throw new Error('week_start must be a Monday YYYY-MM-DD');
            core.setOutput('week', week);
            const tree = await github.rest.git.getTree({...context.repo, tree_sha:'main', recursive:'true'});
            if (tree.data.truncated) throw new Error('Cannot verify complete content tree');
            const complete = tree.data.tree.filter(p =>
              (p.path.startsWith(`content/approved/${week}/`) || p.path.startsWith(`content/published/${week}/`))
              && p.path.endsWith('/post.json')).length;
            const prs = await github.rest.pulls.list({...context.repo, state:'all', head:`${context.repo.owner}:draft/week-${week}`});
            const review = prs.data.find(p => p.state === 'open');
            if (complete === 10 || review) {
              core.notice(`Week ${week} already approved or awaiting review; no duplicate generation.`);
              core.setOutput('needed', 'false');
            } else if (prs.data.some(p => p.state === 'closed' && !p.merged_at)) {
              throw new Error('This batch was rejected. Reopen its PR before regenerating it.');
            } else core.setOutput('needed', 'true');
  draft:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Slides are typeset in Inter. Installing it locally means rendering
      # never depends on Google Fonts being reachable at run time.
      - name: Install Inter
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o /tmp/inter.zip \
            https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          unzip -oq /tmp/inter.zip -d /tmp/inter
          find /tmp/inter -name "*.ttf" -exec cp {} ~/.fonts/ \;
          fc-cache -f
          fc-list | grep -ci inter || echo "Inter not found — slides will use the fallback sans"

      # Reels are assembled with ffmpeg. It ships with the runner image, but
      # check rather than assume — a missing binary here fails five posts.
      - name: Ensure ffmpeg
        run: |
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Run agent checks
        run: |
          python -m compileall -q agent tests
          python -m unittest discover -s tests -v

      - name: Resume latest automatic checkpoint
        uses: actions/cache/restore@v4
        with:
          path: content/queue/${{ needs.prepare.outputs.week }}/
          key: weekly-v2-${{ needs.prepare.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weekly-v2-${{ needs.prepare.outputs.week }}-

      - name: Restore incomplete batch
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: weekly-batch-${{ inputs.recovery_run_id }}
          path: content/queue/
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate batch
        id: batch
        timeout-minutes: 45
        env:
          # Supply whichever key you have. With only GOOGLE_API_KEY set the
          # agent runs on Gemini's free tier; with only ANTHROPIC_API_KEY it
          # runs on Claude. Set the LLM_PROVIDER variable to pin a choice when
          # you have both.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}
          # Reel video generation. Set BUILD_REELS to "false" to get scripts
          # only, or REEL_AI_BACKGROUNDS to "false" to use designed gradients
          # instead of spending image-generation quota.
          BUILD_REELS: ${{ vars.BUILD_REELS }}
          REEL_AI_BACKGROUNDS: ${{ vars.REEL_AI_BACKGROUNDS }}
          # Set to "true" to put a photo from images/ behind carousel hook slides.
          SLIDE_PHOTO_HOOK: ${{ vars.SLIDE_PHOTO_HOOK }}
          # A manual recovery can fill the week that a scheduled run missed,
          # instead of calculating the following Monday.
          BATCH_WEEK_START: ${{ needs.prepare.outputs.week }}
        run: |
          # run_batch writes completed slots before it exits. A retry therefore
          # resumes only the failed slot instead of spending a second batch's
          # API quota or duplicating posts.
          for attempt in 1 2 3; do
            python -u -m agent.run_batch && exit 0
            echo "Batch attempt $attempt failed; retrying any unfinished slot."
            sleep $((attempt * 15))
          done
          echo "::error::The batch remained incomplete after 3 attempts."
          exit 1

      - name: Save completed slots for the next scheduled attempt
        if: always() && steps.batch.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: content/queue/${{ needs.prepare.outputs.week }}/
          key: weekly-v2-${{ needs.prepare.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve batch for review and recovery
        if: always() && steps.batch.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-batch-${{ github.run_id }}
          path: content/queue/
          retention-days: 7

      - name: Open review pull request
        if: success() && steps.batch.outputs.count != '' && steps.batch.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          draft: ${{ inputs.draft_review || false }}
          branch: draft/week-${{ steps.batch.outputs.week }}
          commit-message: "Draft: week of ${{ steps.batch.outputs.week }}"
          title: "📅 Week of ${{ steps.batch.outputs.week }} — ${{ steps.batch.outputs.count }} posts ready"
          body: |
            This week's batch is drafted and rendered.

            **To approve everything:** merge this pull request.
            **To drop a post:** delete its folder from this branch, then merge.
            **To reject the week:** close this pull request.

            Start at [`${{ steps.batch.outputs.batch_dir }}/README.md`](${{ steps.batch.outputs.batch_dir }}/README.md).
            Each post folder has a `POST.md` with the caption ready to copy and
            the rendered slides sitting next to it.

            Anything flagged ⚠️ tripped a content-quality check — do not merge it unchanged.
          labels: |
            content
            needs-review
          delete-branch: true
