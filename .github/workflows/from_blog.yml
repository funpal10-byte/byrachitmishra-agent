name: Check blog feed

# Blog adaptation is included in Draft the week's ten slots.
# This manual check never creates a second calendar or publishes anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: List unused blog articles
        env:
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}
        run: |
          python -c "from agent.blog_pool import unused_articles; articles = unused_articles(); print('\n'.join(a['title'] + ' — ' + a['link'] for a in articles) or 'No unused articles')"
