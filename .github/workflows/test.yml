name: Agent checks

on:
  push:
    paths:
      - "agent/**"
      - "brand/**"
      - "prompts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "agent/**"
      - "brand/**"
      - "prompts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q agent tests
      - run: python -m unittest discover -s tests -v
