name: Gather recent brand developments
on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-brand-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pyyaml
      - name: Collect dated public sources
        id: collect
        run: python -u -m agent.daily_research
      - name: Save research and collection health
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "byrachitmishra-agent"
          git config user.email "actions@github.com"
          git add state/research
          git diff --staged --quiet && exit 0
          git commit -m "Research: collect recent brand developments"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
